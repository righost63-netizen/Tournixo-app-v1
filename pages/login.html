<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Tournixo</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/pages/login.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">
</head>

<body data-page="login">
    <div id="app">

        <!-- ═══════════════════════════════════════════════════════════
             LOGIN SCREEN — Tournixo SaaS style
        ═══════════════════════════════════════════════════════════ -->
        <div id="screen-login" class="screen active">
            <div class="auth-glow"></div>
            <div class="auth-scroll">
                <div class="auth-inner">

                    <!-- Brand lockup -->
                    <div class="auth-brand">
                        <div class="auth-logo-tile">
                            <img src="../images/tournixo-logo.png" onerror="this.onerror=null;this.src='../icons/icon-192.png'" alt="Tournixo" draggable="false">
                        </div>
                        <h1 class="auth-wordmark">Tournixo</h1>
                        <p class="auth-tagline">Free Fire Tournaments</p>
                    </div>

                    <!-- Sign-in card -->
                    <div class="auth-card">
                        <h2>Welcome back</h2>
                        <p class="auth-card-sub">Sign in to continue to your tournament</p>

                        <label class="auth-label" for="login-email">Email address</label>
                        <div class="input-group">
                            <span class="input-icon">✉️</span>
                            <input id="login-email" type="email" placeholder="you@email.com" autocomplete="email">
                        </div>

                        <label class="auth-label" for="login-pass">Password</label>
                        <div class="input-group">
                            <span class="input-icon">🔒</span>
                            <input id="login-pass" type="password" placeholder="Enter your password" autocomplete="current-password">
                            <button type="button" class="input-toggle" aria-label="Show or hide password" onclick="togglePass('login-pass',this)">👁️</button>
                        </div>

                        <div class="auth-links">
                            <button type="button" class="link-btn" id="resend-verify-btn" onclick="resendVerification()">Resend verification email</button>
                            <button type="button" class="link-btn" onclick="showForgotPass()">Forgot password?</button>
                        </div>

                        <button class="btn btn-primary btn-block" id="login-btn" onclick="doLogin()">
                            <span>Sign In</span>
                        </button>

                        <div class="auth-divider"><span>New to Tournixo?</span></div>

                        <button class="btn btn-secondary btn-block" onclick="window.navTo('register')">Create Account</button>
                    </div>

                    <!-- Trust badges -->
                    <div class="auth-trust">
                        <span>🔒 Secure Wallet</span>
                        <span class="dot">•</span>
                        <span>🏆 Daily Tournaments</span>
                        <span class="dot">•</span>
                        <span>⚡ Fast Payouts</span>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script type="module" src="../scripts/navigation.js"></script>
<script type="module" src="../scripts/auth-ui.js"></script>
</body>

</html>
