<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Help & Support - Tournixo</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/pages/help-support.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">
</head>

<body data-page="help-support">
    <div id="app">
        <div id="screen-main" class="screen active">

            <!-- pages/help-support.html -->
            <div class="page help-support-page" id="page-help-support">

                <div class="help-header">
                    <button
                        type="button"
                        class="help-back-btn"
                        onclick="closeHelpSupport()"
                        aria-label="Go back">
                        ‹
                    </button>

                    <h2 class="help-title">Help & Support</h2>

                    <div class="help-header-spacer"></div>
                </div>

                <main class="help-content-area">
                    <p class="help-description">
                        Need help? Contact us through any of the available options below.
                    </p>

                    <div id="help-buttons" class="help-buttons"></div>
                </main>

            </div>

        </div>
    </div>

    <script type="module" src="../scripts/help-support.js"></script>
</body>

</html>
