<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Account - Tournixo</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/pages/login.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">
</head>

<body data-page="register">
    <div id="app">

        <!-- ═══════════════════════════════════════════════════════════
       REGISTER SCREEN — Premium iOS Style
  ═══════════════════════════════════════════════════════════ -->
        <div id="screen-register" class="screen active">
            <div class="auth-scroll">
                <div class="auth-header">
                    <div class="auth-logo">
                        <img src="../images/tournixo-logo.png" onerror="this.onerror=null;this.src='../icons/icon-192.png'" alt="Tournixo" draggable="false">
                    </div>
                    <h2>Create Account</h2>
                    <p>Join the tournament battlefield</p>
                </div>
                <div class="auth-form">
                    
                    <label class="auth-label">In-Game Name (IGN)</label>
<div class="input-group">
    <span class="input-icon">🎮</span>
    <input id="reg-name" type="text" maxlength="25" placeholder="তোমার Free Fire IGN" autocomplete="off">
</div>
                  
<label class="auth-label">Free Fire UID</label>
<div class="input-group">
    <span class="input-icon">🎯</span>
    <input
        id="reg-ffuid"
        type="text"
        inputmode="numeric"
        maxlength="12"
        placeholder="তোমার Free Fire UID"
        autocomplete="off"
    >
</div>

                    <label class="auth-label">Email</label>
                    <div class="input-group">
                        <span class="input-icon">✉️</span>
                        <input id="reg-email" type="email" placeholder="your@email.com" autocomplete="email">
                    </div>
                    <label class="auth-label">Password</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input id="reg-pass" type="password" placeholder="Min 6 characters" autocomplete="new-password">
                        <button type="button" class="input-toggle" aria-label="Show or hide password" onclick="togglePass('reg-pass',this)">👁️</button>
                    </div>
                    <label class="auth-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input id="reg-cpass" type="password" placeholder="Repeat password" autocomplete="new-password">
                        <button type="button" class="input-toggle" aria-label="Show or hide password" onclick="togglePass('reg-cpass',this)">👁️</button>
                    </div>
                    <label style="display:flex;align-items:flex-start;gap:10px;margin:16px 0;font-size:13px;line-height:1.5;color:var(--text2);cursor:pointer;">
                        <input id="reg-terms" type="checkbox" style="width:18px;height:18px;min-width:18px;margin:2px 0 0;flex-shrink:0;accent-color:var(--accent);">
                        <span>I agree to the <a href="terms.html" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">Terms &amp; Conditions</a></span>
                    </label>
                    <button class="btn btn-primary" id="reg-btn" onclick="doRegister()">Create Account</button>
                    <div class="auth-divider">
                        <span>Already have an account?</span>
                    </div>
                    <button class="btn btn-secondary" onclick="navTo('login')">Sign In</button>
                    <div style="height:40px;"></div>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="../scripts/auth-ui.js"></script>
</body>

</html>
