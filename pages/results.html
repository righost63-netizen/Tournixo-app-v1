<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Results - Tournixo</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/pages/results.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <meta name="theme-color" content="#080808">
<!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">

</head>
<body data-page="results">
 <div id="app">
        <div id="screen-main" class="screen active">

            <!-- RESULTS — full page (not a popup) -->
            <div id="tab-results" class="tab-panel active-tab" style="flex:1;flex-direction:column;overflow:hidden;">
                <div class="top-nav" style="justify-content:flex-start;gap:14px;">
                    <button class="back-btn" onclick="goBack('profile')">‹ Back</button>
                    <h1>Results</h1>
                </div>
                <div class="scroll-area results-scroll">
                    <!-- results.html?id=<tournamentId> → that tournament's scoreboard
                         results.html            → list of completed tournaments -->
                    <div id="published-results-list"></div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="../scripts/results.js"></script>
</body>

</html>
