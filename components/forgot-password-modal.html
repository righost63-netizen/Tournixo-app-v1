<!-- FORGOT PASSWORD MODAL -->
<div id="modal-forgot-pass" class="full-modal">
    <div class="modal-header">
        <button class="back-btn" onclick="closeModal('modal-forgot-pass')">‹ Back</button>
        <h2>Reset Password</h2>
    </div>
    <div class="scroll-area" style="padding:20px;">
        <p style="font-size:14px;color:var(--text2);margin-bottom:20px;">Enter your account email and we'll send you a link to reset your password.</p>
        <label class="auth-label">Email</label>
        <div class="input-group">
            <span class="input-icon">✉️</span>
            <input id="forgot-email" type="email" placeholder="your@email.com" autocomplete="email">
        </div>
        <button class="btn btn-primary" id="forgot-send-btn" style="margin-top:20px;" onclick="sendPasswordReset()">
            <span>Send Reset Link</span>
        </button>
    </div>
</div>
